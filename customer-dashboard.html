<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | Momento</title>
    <link rel="icon" type="image/png" href="Stock/logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-wrapper { max-width: 800px; margin: 120px auto 100px; padding: 0 5vw; }
        .ticket-card { background: white; border-radius: 20px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(90, 64, 73, 0.05); border: 1px solid rgba(200, 169, 106, 0.2); overflow: hidden; }
        
        /* The Clickable Header */
        .ticket-header { display: flex; justify-content: space-between; align-items: center; padding: 25px; cursor: pointer; transition: background 0.3s; }
        .ticket-header:hover { background: #fcf9f6; }
        .ticket-id-badge { font-family: monospace; color: var(--accent-color); font-weight: bold; font-size: 1.1rem; background: #fcf9f6; padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(200, 169, 106, 0.2); }
        .chevron { font-size: 1rem; color: var(--accent-color); transition: transform 0.3s ease; margin-left: 10px; }
        .chevron.up { transform: rotate(180deg); }

        /* The Hidden Timeline Container */
        .timeline-container { display: none; padding: 0 25px 25px 25px; border-top: 1px solid #f0f0f0; margin-top: -5px; }
        .timeline-container.show { display: block; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Timeline CSS */
        .timeline { position: relative; margin-top: 20px; padding-left: 20px; }
        .timeline::before { content: ''; position: absolute; left: 24px; top: 0; height: 100%; width: 2px; background: #eee; }
        .timeline-step { position: relative; padding-left: 30px; margin-bottom: 25px; opacity: 0.4; transition: 0.3s; }
        .timeline-step::before { content: ''; position: absolute; left: -2px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #eee; border: 3px solid white; box-shadow: 0 0 0 2px #ddd; z-index: 2; }
        
        /* Active States */
        .timeline-step.active { opacity: 1; }
        .timeline-step.active::before { background: var(--accent-color); box-shadow: 0 0 0 2px var(--accent-color); }
        .timeline-step.completed { opacity: 1; }
        .timeline-step.completed::before { background: #27ae60; box-shadow: 0 0 0 2px #27ae60; }
        
        .step-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--primary-color); margin-bottom: 2px; font-weight: bold; }
        .step-time { font-size: 0.8rem; color: gray; font-family: monospace; }
        .step-info { background: #fcf9f6; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 0.9rem; border-left: 3px solid var(--accent-color); }
    </style>
</head>
<body class="about-page">
    
    <!-- Use your existing Light Navbar from index.html here -->

    <main class="dashboard-wrapper">
        <h1 style="color: var(--primary-color); margin-bottom: 10px;">My Bookings</h1>
        <p style="opacity: 0.8; margin-bottom: 30px;">Track the status of your upcoming events.</p>
        
        <div id="customer-bookings-container">
            <p style="text-align: center; opacity: 0.6;">Loading your moments...</p>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const userString = localStorage.getItem('momentoUser');
            if (!userString) {
                window.location.href = "index.html";
                return;
            }
            
            const user = JSON.parse(userString);
            const container = document.getElementById('customer-bookings-container');
            
            try {
                const res = await fetch(`https://api.momentoo.in/api/customer/bookings/${user.id}`);
                const data = await res.json();
                
                if (data.success && data.data.length > 0) {
                    container.innerHTML = '';
                    
                    data.data.forEach(ticket => {
                        const formatDate = (isoString) => {
                            if (!isoString) return 'Pending...';
                            const d = new Date(isoString);
                            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' at ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                        };

                        const statusMap = {
                            'pending': 1,             
                            'quotation_sent': 2,      
                            'confirmed': 3,           
                            'artist_arrived': 4,      
                            'artist_left': 5,         
                            'final_paid': 6,          
                            'completed': 7            
                        };
                        const currentLvl = statusMap[ticket.status] !== undefined ? statusMap[ticket.status] : 0;

                        const getStepClass = (lvl) => {
                            if (currentLvl > lvl) return 'completed';
                            if (currentLvl === lvl) return 'active';
                            return '';
                        };

                        let paymentInfo = '';
                        if (currentLvl === 1 && ticket.quotation_amount) {
                            paymentInfo = `
                                <div class="step-info">
                                    <strong>Quotation Ready:</strong> ₹${ticket.quotation_amount}<br>
                                    <span style="color: #e74c3c;">Advance Due: ₹${ticket.advance_amount}</span><br>
                                    <em>Our team will contact you shortly for payment.</em>
                                </div>`;
                        }

                        let dispatchInfo = '';
                        if (currentLvl === 6 && ticket.tracking_id) {
                            dispatchInfo = `
                                <div class="step-info" style="border-left-color: #8e44ad;">
                                    <strong>Dispatched via ${ticket.courier_partner}</strong><br>
                                    Tracking ID: ${ticket.tracking_id}
                                </div>`;
                        }

                        // --- NEW: FEEDBACK UI GENERATOR ---
                        let feedbackUI = '';
                        if (currentLvl >= 4) { // Triggered only after the Artist leaves (artist_left is level 4+)
                            if (!ticket.feedback_submitted) {
                                feedbackUI = `
                                    <div style="margin-top: 15px; padding: 20px; background: #fffdfa; border: 1px solid #eaddd7; border-radius: 12px; text-align: center;">
                                        <h4 style="color: var(--primary-color); margin-bottom: 5px;">Rate your experience</h4>
                                        <p style="font-size: 0.85rem; opacity: 0.8; margin-bottom: 15px;">How was the artist's behavior, quality, and overall work?</p>
                                        
                                        <div id="stars-${ticket.ticket_id}" style="font-size: 2.2rem; color: #ddd; cursor: pointer; margin-bottom: 15px; user-select: none;">
                                            <span onclick="setRating('${ticket.ticket_id}', 1)">★</span>
                                            <span onclick="setRating('${ticket.ticket_id}', 2)">★</span>
                                            <span onclick="setRating('${ticket.ticket_id}', 3)">★</span>
                                            <span onclick="setRating('${ticket.ticket_id}', 4)">★</span>
                                            <span onclick="setRating('${ticket.ticket_id}', 5)">★</span>
                                        </div>
                                        <input type="hidden" id="rating-val-${ticket.ticket_id}" value="0">
                                        
                                        <textarea id="review-${ticket.ticket_id}" placeholder="Write a short review..." style="width: 100%; height: 70px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: inherit; margin-bottom: 15px; resize: none;"></textarea>
                                        
                                        <button onclick="submitFeedback('${ticket.ticket_id}')" style="background: var(--primary-color); color: white; border: none; padding: 10px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s;">Submit Review</button>
                                    </div>
                                `;
                            } else {
                                const ratingNum = ticket.rating || 5;
                                const starsHtml = '<span style="color:#f39c12;">★</span>'.repeat(ratingNum) + '<span style="color:#ddd;">★</span>'.repeat(5 - ratingNum);
                                feedbackUI = `
                                    <div style="margin-top: 15px; padding: 15px; background: #fcf9f6; border: 1px solid #eaddd7; border-radius: 12px; text-align: center;">
                                        <h4 style="color: var(--primary-color); margin-bottom: 5px;">Your Review</h4>
                                        <div style="font-size: 1.5rem; margin-bottom: 10px;">${starsHtml}</div>
                                        <p style="font-size: 0.9rem; font-style: italic; opacity: 0.8; margin: 0;">"${ticket.review_text || ''}"</p>
                                    </div>
                                `;
                            }
                        }

                        container.innerHTML += `
                            <div class="ticket-card">
                                <div class="ticket-header" onclick="toggleTimeline('${ticket.ticket_id}')">
                                    <div style="flex: 1;">
                                        <h3 style="color: var(--primary-color); margin-bottom: 5px;">${ticket.pro_name}</h3>
                                        <p style="opacity: 0.8; font-size: 0.9rem; margin: 0;">${ticket.category} (${ticket.artist_type})</p>
                                    </div>
                                    <div style="display: flex; align-items: center;">
                                        <span class="ticket-id-badge">${ticket.ticket_id}</span>
                                        <span class="chevron" id="chev-${ticket.ticket_id}">▼</span>
                                    </div>
                                </div>
                                
                                <div id="timeline-${ticket.ticket_id}" class="timeline-container">
                                    <div class="timeline">
                                        <div class="timeline-step ${getStepClass(0)}">
                                            <div class="step-title">Booking Requested</div>
                                            <div class="step-time">${formatDate(ticket.created_at)}</div>
                                        </div>
                                        <div class="timeline-step ${getStepClass(1)}">
                                            <div class="step-title">Quotation Sent</div>
                                            <div class="step-time">${formatDate(ticket.quoted_at)}</div>
                                            ${paymentInfo}
                                        </div>
                                        <div class="timeline-step ${getStepClass(2)}">
                                            <div class="step-title">Advance Paid & Dates Locked</div>
                                            <div class="step-time">${formatDate(ticket.confirmed_at)}</div>
                                        </div>
                                        <div class="timeline-step ${getStepClass(3)}">
                                            <div class="step-title">Artist Arrived</div>
                                            <div class="step-time">${formatDate(ticket.artist_arrived_at)}</div>
                                        </div>
                                        <div class="timeline-step ${getStepClass(4)}">
                                            <div class="step-title">Job Finished (Artist Left)</div>
                                            <div class="step-time">${formatDate(ticket.artist_left_at)}</div>
                                        </div>
                                        <div class="timeline-step ${getStepClass(5)}">
                                            <div class="step-title">Final Balance Paid</div>
                                            <div class="step-time">${formatDate(ticket.final_payment_at)}</div>
                                        </div>
                                        <div class="timeline-step ${getStepClass(6)}">
                                            <div class="step-title">Deliverables Dispatched</div>
                                            <div class="step-time">${formatDate(ticket.completed_at)}</div>
                                            ${dispatchInfo}
                                        </div>
                                    </div>
                                </div>
                                ${feedbackUI} <!-- INJECTED HERE SO IT IS VISIBLE WITHOUT EXPANDING -->
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; opacity: 0.6;">You have no active bookings.</p>';
                }
            } catch (err) {
                container.innerHTML = '<p style="text-align: center; color: red;">Failed to load bookings. Please try again.</p>';
            }
        });

        // Global function to toggle the accordion
        window.toggleTimeline = function(ticketId) {
            const timeline = document.getElementById(`timeline-${ticketId}`);
            const chev = document.getElementById(`chev-${ticketId}`);
            
            if (timeline.classList.contains('show')) {
                timeline.classList.remove('show');
                chev.classList.remove('up');
            } else {
                timeline.classList.add('show');
                chev.classList.add('up');
            }
        };

        // Global function to handle Star Hover/Click
        window.setRating = function(ticketId, rating) {
            document.getElementById(`rating-val-${ticketId}`).value = rating;
            const stars = document.getElementById(`stars-${ticketId}`).children;
            for (let i = 0; i < 5; i++) {
                stars[i].style.color = i < rating ? '#f39c12' : '#ddd';
            }
        };

        // Global function to Submit Feedback to Backend
        window.submitFeedback = async function(ticketId) {
            const rating = document.getElementById(`rating-val-${ticketId}`).value;
            const text = document.getElementById(`review-${ticketId}`).value.trim();
            
            if (rating == 0) return alert("Please select a star rating.");
            if (!text) return alert("Please write a short review detailing your experience.");
            
            try {
                const res = await fetch('https://api.momentoo.in/api/customer/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticketId, rating, reviewText: text })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Thank you! Your feedback has been submitted.");
                    location.reload(); // Refresh the page to lock in the rating UI
                } else {
                    alert("Error submitting feedback.");
                }
            } catch (e) {
                alert("Network error.");
            }
        };
    </script>
</body>
</html>
