<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll Be Right Back | Momento</title>
    <link rel="icon" type="image/png" href="Stock/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Lato', sans-serif;
            background-color: #F5EBEB; /* Momento light background */
            color: #5a4049; /* Momento primary color */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .brand-text {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .video-wrapper {
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(90, 64, 73, 0.15);
            margin-bottom: 40px;
            background: #0f0f10;
        }

        .maintenance-video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .maintenance-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #3C3633;
        }

        .maintenance-text p {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.85;
            max-width: 500px;
            margin: 0 auto;
        }

        @media (max-width: 850px) {
            .maintenance-text h1 { font-size: 2rem; }
            .brand-text { font-size: 1.5rem; }
            .brand-logo { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <div class="brand-container">
        <img src="Stock/logo.png" alt="Momento Logo" class="brand-logo">
        <span class="brand-text">MOMENTO</span>
    </div>

    <div class="video-wrapper">
        <!-- Autoplay, muted, and loop ensure the video plays automatically on all devices -->
        <video class="maintenance-video" autoplay muted loop playsinline>
            <source src="Stock/maintenance_video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="maintenance-text">
        <h1>We are upgrading.</h1>
        <p>We are currently brewing something special behind the scenes to bring you a better experience. We will come back shortly.</p>
    </div>

</body>
</html>
