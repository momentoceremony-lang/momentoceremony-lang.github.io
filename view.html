<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Momento Photography</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="about-page"> <!-- Reusing light theme background -->

    <!-- Reusing the Light Navbar -->
    <nav class="light-nav">
        <div class="nav-brand">
            <a href="index.html" style="display:flex; align-items:center; text-decoration:none;">
                <img src="Stock/logo.png" alt="Momento Logo" class="rolling-logo">
                <span class="logo-text-dark">MOMENTO</span>
            </a>
        </div>
        <!-- Right Side: Links & Login -->
        <div class="nav-right desktop-only">
            <div class="nav-links">
                <a href="index.html">Home</a>
                
                <!-- Categories Dropdown -->
                <div class="nav-dropdown">
                    <a href="index.html#category-wedding" style="cursor: default;">Categories ▾</a>
                    <div class="nav-dropdown-content">
                        <a href="view.html?category=wedding">Weddings</a>
                        <a href="view.html?category=prewed">Pre-Weddings</a>
                        <a href="view.html?category=birthday">Birthdays</a>
                        <a href="view.html?category=baby">Baby Shoots</a>
                        <a href="view.html?category=anni">Anniversaries</a>
                        <a href="view.html?category=mehndi">Mehndi</a>
                    </div>
                </div>

                <!-- Professionals Dropdown -->
                <div class="nav-dropdown">
                    <a href="photographers.html" style="cursor: default;">Our Professionals ▾</a>
                    <div class="nav-dropdown-content">
                        <a href="photographers.html?type=photographer">Photographers</a>
                        <a href="photographers.html?type=mehndi">Mehndi Artists</a>
                    </div>
                </div>

                <a href="#" onclick="openModal('modal-booking'); return false;">Book an Artist</a>
                <!-- Contact Dropdown -->
                <div class="nav-dropdown">
                    <a href="index.html#site-footer" style="cursor: default;">Contact Us ▾</a>
                    <div class="nav-dropdown-content" style="min-width: 260px; padding: 15px 0;">
                        <a href="#" onclick="handlePhoneClick(event, '+919330224549')">📞 +91 93302 24549</a>
                        <a href="mailto:momentoceremony@gmail.com">✉️ momentoceremony@gmail.com</a>
                        
                        <!-- Social Links Row -->
                        <div style="display: flex; gap: 20px; margin-top: 5px; padding: 15px 25px 5px 25px; border-top: 1px solid rgba(200, 169, 106, 0.2);">
                            <a href="https://www.facebook.com/" target="_blank" style="padding: 0 !important; font-size: 0.9rem !important;">Facebook</a>
                            <a href="https://www.instagram.com/" target="_blank" style="padding: 0 !important; font-size: 0.9rem !important;">Instagram</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="auth-buttons">
                <button class="btn-login-light btn-login">Login</button>
            </div>
        </div>
    </nav>

    <!-- GALLERY SECTION -->
    <main style="padding-top: 90px; text-align: center;">
        
        <!-- Category Filter Buttons -->
        <div class="gallery-filters">
            <button class="filter-btn" onclick="filterGallery('wedding')">Weddings</button>
            <button class="filter-btn" onclick="filterGallery('prewed')">Pre-Weddings</button>
            <button class="filter-btn" onclick="filterGallery('birthday')">Birthdays</button>
            <button class="filter-btn" onclick="filterGallery('baby')">Baby Shoots</button>
            <button class="filter-btn" onclick="filterGallery('anni')">Anniversaries</button>
        </div>

        <!-- The Image Viewer Layout (Like your screenshot) -->
        <div class="gallery-viewer">
            <!-- Main Large Image -->
            <div class="main-image-wrapper">
                <button class="nav-arrow left-arrow" onclick="prevImage()">&#10094;</button>
                <img id="main-gallery-img" src="" alt="Gallery View">
                <button class="nav-arrow right-arrow" onclick="nextImage()">&#10095;</button>
            </div>
            
            <!-- Small Thumbnails Below -->
            <div class="thumbnail-row" id="thumbnail-container">
                <!-- Javascript will generate the small images here -->
            </div>
        </div>

        <button class="btn-signup-gold" style="margin-top: 30px; padding: 12px 40px; font-size: 1.1rem;" onclick="window.location.href='index.html'">Back to Home</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
