<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographer Profile | Momento</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body class="about-page"> <!-- Soft #F5EBEB background -->

    <!-- Light Navigation -->
    <nav class="light-nav">
        <div class="nav-brand">
            <a href="index.html" style="display:flex; align-items:center; text-decoration:none;">
                <img src="Stock/logo.png" alt="Momento Logo" class="rolling-logo">
                <span class="logo-text-dark">MOMENTO</span>
            </a>
        </div>
        <div class="nav-right desktop-only">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="photographers.html">Photographers</a>
            </div>
        </div>
    </nav>

    <!-- Main Profile Container -->
    <main style="padding-top: 100px; max-width: 1000px; margin: 0 auto; padding-bottom: 80px; padding-left: 5vw; padding-right: 5vw;">
        
        <div class="dedicated-profile-card">
            <!-- Banner -->
            <div class="profile-banner-wrapper">
                <img id="page-banner" src="" alt="Cover" class="profile-banner-img">
            </div>

            <!-- Profile Info Header -->
            <div class="profile-info-header">
                <!-- DP -->
                <div class="profile-dp-wrapper">
                    <img id="page-dp" src="" alt="DP">
                </div>
                
                <!-- Action Buttons (Share & Book) -->
                <div class="profile-action-buttons">
                    <button class="btn-share" onclick="shareProfile()">
                        <!-- Share Icon SVG -->
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: middle;"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                        Share
                    </button>
                    <button class="btn-book-now" id="page-book-btn" onclick="">Book Now</button>
                </div>
            </div>

            <!-- Text Details -->
            <div class="profile-text-content">
                <h1 id="page-name" style="font-family: 'Playfair Display', serif; font-size: 2.5rem; color: #3C3633; margin-bottom: 8px;">Loading...</h1>
                <p id="page-specs" style="font-family: 'Lato', sans-serif; font-size: 0.95rem; color: #c8a96a; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;"></p>
                <p id="page-bio" style="font-family: 'Lato', sans-serif; font-size: 1.1rem; line-height: 1.7; color: var(--primary-color); opacity: 0.85;"></p>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(200, 169, 106, 0.2); margin: 40px;">

            <!-- Portfolio Gallery -->
            <div style="padding: 0 40px 40px;">
                <h3 style="font-family: 'Playfair Display', serif; font-size: 2rem; color: #3C3633; margin-bottom: 25px;">Portfolio</h3>
                
                <!-- NEW: Dynamic Category Filters Container -->
                <div id="profile-gallery-filters" class="gallery-filters" style="margin-bottom: 30px; flex-wrap: wrap;"></div>
                
                <div id="page-gallery" class="pro-gallery-grid">
                    <!-- Images injected here -->
                </div>
            </div>
        </div>

    </main>

    <!-- Include your existing booking modals here (Copy from index.html) -->
    <div id="modal-booking" class="modal">...</div>
    <div id="modal-booking-success" class="modal">...</div>
    <div id="modal-auth" class="modal">...</div>

    <script src="script.js"></script>
</body>
</html>
